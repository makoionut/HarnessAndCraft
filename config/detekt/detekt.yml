build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

# Specific naming exceptions for Jetpack Compose
naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    # Allows private constants and Compose objects
    constantPattern: '[A-Z][A-Za-z0-9_]*'

# Best practices for Coroutines in production
coroutines:
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true

complexity:
  StringLiteralDuplication:
    active: true
    threshold: 3
    ignoreAnnotation: true

# Disable noisy rules
style:
  MagicNumber:
    active: false
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|preview.*)'
  WildcardImport:
    active: true
    excludeImports: []
